[package]
name = "voyager-shell"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A local service for registering native agents and recording attributed events"
publish = false

[[bin]]
name = "voyager-probe"
path = "src/main.rs"

[[bin]]
name = "voyager"
path = "src/bin/voyager.rs"

[dependencies]
anyhow = "1"
nix = { version = "0.31.3", features = ["socket", "uio", "user", "ioctl", "fs", "signal", "process", "term"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
uuid = { version = "1.26.1", features = ["v4"] }
x11rb = { version = "0.14.0", features = ["shape"] }
