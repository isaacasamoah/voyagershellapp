<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; frame-src voyager-portal:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:; media-src 'self' blob:;"
    />
    <title>Voyager</title>
    <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="identity.css" />
  </head>
  <body>
    <aside id="sidebar">
      <div id="home-dock" class="home-dock">
        <img id="home-brand" src="brand.svg" alt="Voyager" />
        <div id="avatar-home"></div>
        <p id="home-tagline">Let's Go Together</p>
        <div id="home-controls" aria-label="Voyager conversation controls">
          <button
            id="avatar-chat"
            type="button"
            aria-label="Text chat"
            title="Text chat"
            aria-expanded="false"
          >
            <svg viewBox="0 0 20 18" aria-hidden="true">
              <path
                d="M4 2h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H9l-5 3v-3a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z"
              />
              <path d="M6 6h8M6 9h5" />
            </svg>
          </button>
        </div>
      </div>
      <aside id="chat" hidden>
        <header>
          <div>
            <strong id="chat-focus">Whole workspace</strong>
          </div>
          <button id="close-chat" aria-label="Close conversation">×</button>
        </header>
        <div id="messages" role="log" aria-live="polite"></div>
        <div id="chat-state" role="status">Ready when you are</div>
        <button id="reconnect" hidden>Reconnect Voyager</button>
        <form id="composer">
          <textarea
            id="chat-text"
            rows="2"
            placeholder="What shall we work on?"
            aria-label="Message Voyager"
          ></textarea>
          <div>
            <span>Let's go together</span
            ><button type="submit" id="send" aria-label="Send message">
              ↑
            </button>
          </div>
        </form>
      </aside>
      <button id="home" class="nav-home">
        <span>⌂</span> Home <kbd>⌘ 1</kbd>
      </button>
      <div class="section-label">
        <span>Voyages</span
        ><button id="add-realm" title="New Voyage" aria-label="New Voyage">
          +
        </button>
      </div>
      <nav id="realms" aria-label="Voyages"></nav>
    </aside>
    <main>
      <header id="topbar">
        <button
          id="toggle-sidebar"
          class="icon-button"
          title="Toggle sidebar"
          aria-label="Toggle sidebar"
        >
          ◧
        </button>
        <div id="dimension-avatar"></div>
        <div id="breadcrumb">Voyager</div>
        <div class="topbar-spacer"></div>
        <button
          id="scope-label"
          title="Voyager acts with your authority in this context"
        >
          Whole workspace
        </button>
        <div id="workspace-controls"></div>
      </header>
      <div id="dimensions-row">
        <nav id="dimensions" aria-label="Fleets"></nav>
        <button id="add-dimension" aria-label="New Fleet" title="New Fleet">
          +
        </button>
        <div class="dimension-spacer"></div>
        <button id="new-portal" title="New Vessel" aria-label="New Vessel">
          + Vessel
        </button>
        <button
          id="split-horizontal"
          title="Split side by side"
          aria-label="Split side by side"
        >
          ◫</button
        ><button
          id="split-vertical"
          title="Split top and bottom"
          aria-label="Split top and bottom"
        >
          ⬒
        </button>
      </div>
      <div id="content">
        <section id="portals" aria-label="Vessels">
          <div class="loading">
            Opening your workspace<span>Connecting to Herdr Core</span>
          </div>
        </section>
      </div>
      <footer>
        <span id="connection"><span class="status-dot"></span>Starting</span
        ><span id="context">Shell workspace</span>
        <div></div>
        <span id="core-version"></span
        ><button id="shortcuts" title="Keyboard shortcuts">⌘ K</button>
      </footer>
    </main>
    <div id="voyager-avatar" data-place="home">
      <button
        id="avatar"
        title="Minimize Voyager. Pull to move."
        aria-label="Minimize Voyager"
      >
        <img
          id="astronaut-back"
          src="../../desktop/assets/idle.png"
          alt=""
          draggable="false"
        />
        <img
          id="astronaut-front"
          src="../../desktop/assets/idle.png"
          alt=""
          draggable="false"
        />
        <span class="status-dot" aria-hidden="true"></span>
      </button>
      <button
        id="voice"
        type="button"
        aria-label="Start voice"
        title="Start voice"
        aria-pressed="false"
      >
        <svg viewBox="0 0 20 16" aria-hidden="true">
          <path d="M2 6v4M6 3v10M10 1v14M14 3v10M18 6v4" />
        </svg>
      </button>
    </div>
    <div id="toast" role="status" hidden></div>
    <dialog id="dialog">
      <form method="dialog">
        <header>
          <h2 id="dialog-title"></h2>
          <button value="cancel" formnovalidate aria-label="Close dialog">
            ×
          </button>
        </header>
        <div id="dialog-body"></div>
        <div id="dialog-actions"></div>
      </form>
    </dialog>
    <audio id="voice-output" autoplay></audio>
    <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="../../desktop/src/ui/astronaut.js"></script>
    <script src="portal-frames.js"></script>
    <script src="organisation.js"></script>
    <script src="content-picker.js"></script>
    <script src="renderer.js"></script>
    <script src="chat.js"></script>
    <script src="identity.js"></script>
    <script src="avatar-art.js"></script>
  </body>
</html>
