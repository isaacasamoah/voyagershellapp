<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'"
    />
    <title>Voyager · sessions</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section id="panel" hidden aria-label="Voyager session dashboard">
        <header>
          <span class="wordmark">VOYAGER</span><span class="small">this machine · private</span>
        </header>
        <div id="connection" role="status">Connecting…</div>
        <div id="sessions" aria-label="Registered sessions"></div>
        <div id="actions">
          <button id="open-terminal">Open demo terminal</button><button id="undock">Undock</button>
        </div>
        <div id="targets" aria-label="Docking alternatives"></div>
        <p id="notice" role="status"></p>
        <div id="events" aria-label="Captured events"></div>
        <footer>
          <span>Fixed-thread Ghostty demo · XWayland</span><button id="quit">Quit avatar</button>
        </footer>
      </section>
      <button
        id="avatar"
        class="avatar"
        data-state="floating"
        aria-label="Voyager. Click for sessions. Drag to dock."
        aria-expanded="false"
      >
        <img src="assets/idle.png" alt="" draggable="false" /><svg
          class="brand"
          viewBox="0 0 200 200"
          aria-hidden="true"
        >
          <defs>
            <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ff5f56" />
              <stop offset="20%" stop-color="#f7a34b" />
              <stop offset="40%" stop-color="#f4e04d" />
              <stop offset="60%" stop-color="#5ec98f" />
              <stop offset="80%" stop-color="#59a5ff" />
              <stop offset="100%" stop-color="#b07af5" />
            </linearGradient>
            <linearGradient id="tagline-spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#f7a34b" />
              <stop offset="50%" stop-color="#f4e04d" />
              <stop offset="100%" stop-color="#59a5ff" />
            </linearGradient>
            <path id="upper-arc" d="M 32 100 A 68 68 0 0 1 168 100" fill="none" />
            <path id="lower-arc" d="M 18 100 A 82 82 0 0 0 182 100" fill="none" />
          </defs>
          <g
            font-family="VoyagerMono,ui-monospace,monospace"
            font-size="23"
            font-weight="900"
            letter-spacing="5.5"
          >
            <g transform="translate(1.8,2.2)">
              <text fill="#12071f">
                <textPath href="#upper-arc" startOffset="50%" text-anchor="middle">
                  VOYAGER
                </textPath>
              </text>
            </g>
            <g transform="translate(.8,1)">
              <text fill="#2a1245">
                <textPath href="#upper-arc" startOffset="50%" text-anchor="middle">
                  VOYAGER
                </textPath>
              </text>
            </g>
            <text fill="url(#rainbow)" stroke="#fff7e6" stroke-width=".2">
              <textPath href="#upper-arc" startOffset="50%" text-anchor="middle">VOYAGER</textPath>
            </text>
          </g>
          <text
            fill="url(#tagline-spectrum)"
            opacity="0.5"
            font-family="VoyagerMono,ui-monospace,monospace"
            font-size="11.6"
            font-weight="500"
            letter-spacing="1.2"
          >
            <textPath href="#lower-arc" startOffset="50%" text-anchor="middle">
              let's go together
            </textPath>
          </text></svg
        ><span id="indicator" aria-hidden="true"></span>
      </button>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
